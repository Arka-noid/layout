[project]
name = "layout"
version = "0.1.0"
description = "Generic playground for photonic layout design with gdsfactory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gdsfactory>=9.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layout"]
